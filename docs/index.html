<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TBrowse — moved to tbrowse.org</title>
    <!-- Stopgap redirect: the legacy GitHub-Pages-served playground
         used to live here; the project home is now tbrowse.org. The
         meta refresh fires immediately for users with JS disabled;
         the script accelerates the redirect for everyone else. -->
    <meta http-equiv="refresh" content="0; url=https://tbrowse.org/" />
    <link rel="canonical" href="https://tbrowse.org/" />
    <meta name="robots" content="noindex" />
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #222222;
      }
      a {
        color: #1d5fb1;
      }
    </style>
    <script>
      window.location.replace('https://tbrowse.org/');
    </script>
  </head>
  <body>
    <p>
      TBrowse has moved to
      <a href="https://tbrowse.org/">tbrowse.org</a>.
    </p>
  </body>
</html>
